name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: 安装Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: 构建APK
        run: |
          export P4A_BOOTSTRAP_DOWNLOAD_HOST=https://mirrors.tuna.tsinghua.edu.cn/github-release/kivy/python-for-android
          export P4A_RELEASES=https://mirrors.tuna.tsinghua.edu.cn/github-release/kivy/python-for-android
          buildozer android debug || true
          echo "===== 列出全部文件 ====="
          ls -R
          echo "===== bin目录内容 ====="
          ls -la bin || echo "bin文件夹不存在或者是空的！"
          # 检查apk是否存在，不存在就报错终止
          if [ ! -f bin/*.apk ]; then
            echo "::error::APK构建失败，没有生成bin下的安装包！网络拉取资源大概率超时"
            exit 1
          fi

      - name: 上传APK工件
        uses: actions/upload-artifact@v4
        with:
          name: english-study-apk
          path: bin/*.apk

